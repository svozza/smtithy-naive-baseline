name: tool capability probe

on:
  workflow_dispatch:
    inputs:
      probe:
        type: choice
        options: [write, edit, workflow, task, skill, toolsearch]
        required: true
      runs:
        type: number
        default: 1

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Run trusted tool probe
        env:
          CLAUDE_CODE_USE_BEDROCK: "1"
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: us-east-1
          ANTHROPIC_MODEL: global.anthropic.claude-opus-4-8[1m]
          DISABLE_TELEMETRY: "1"
          DISABLE_ERROR_REPORTING: "1"
          DISABLE_AUTOUPDATER: "1"
        run: >-
          uv run --frozen python eval/run_tool_capability_probe.py
          --probe "${{ inputs.probe }}"
          --runs "${{ inputs.runs }}"
          --out results
      - name: Upload redacted results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-capability-${{ inputs.probe }}
          path: results/
